<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0284c7" />
  <title>SIBIHA - HBIG Monitoring</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-width: 100%;
      height: 100%;
      min-height: 100vh;
      overflow: hidden;
      background-color: #0284c7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background-color: #ffffff;
      z-index: 1;
    }

    /* Splash Screen penuh dari GitHub */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 25;
      background-color: #0284c7;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.35s ease;
    }

    #splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #splash-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #fallback-panel {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #f8fafc;
      color: #0f172a;
      z-index: 30;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    #fallback-panel.active {
      display: flex;
    }

    .fallback-card {
      max-width: 420px;
      width: 100%;
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .fallback-card h2 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #0f172a;
    }

    .fallback-card p {
      font-size: 14px;
      line-height: 1.5;
      color: #475569;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button, a.btn {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div id="splash-screen" aria-hidden="true">
    <img id="splash-img" src="./splash_sibiha.png" alt="Splash Screen SIBIHA" />
  </div>

  <iframe
    id="app-frame"
    src="about:blank"
    title="SIBIHA Web App"
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write; downloads; fullscreen"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <div id="fallback-panel" role="alert">
    <div class="fallback-card">
      <h2>Aplikasi tidak dapat dimuat di frame</h2>
      <p>
        Hal ini biasanya terjadi jika deployment Google Apps Script belum diatur ke <strong>Anyone</strong>,
        sedang meminta login akun Google yang diblokir iframe, atau koneksi jaringan terputus.
      </p>
      <div class="btn-group">
        <button type="button" class="btn-primary" id="retry-btn">Muat Ulang</button>
        <a
          class="btn btn-secondary"
          id="direct-link"
          href="https://script.google.com/macros/s/AKfycbz2ZUGYl3k-sVsd0r495nvO_O4REpwPNdfu03EgCICll4vwZQT3O0YkoVMSaSwccPSMIw/exec"
          target="_blank"
          rel="noopener noreferrer"
        >
          Buka Langsung
        </a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2ZUGYl3k-sVsd0r495nvO_O4REpwPNdfu03EgCICll4vwZQT3O0YkoVMSaSwccPSMIw/exec";
      const MIN_SPLASH_MS = 1800;
      const FORCE_SPLASH_CLOSE_MS = 4000;
      const MAX_WAIT_MS = 16000;

      const frame = document.getElementById("app-frame");
      const splash = document.getElementById("splash-screen");
      const fallback = document.getElementById("fallback-panel");
      const retryBtn = document.getElementById("retry-btn");
      const directLink = document.getElementById("direct-link");

      directLink.href = SCRIPT_URL;

      let loadTimer = null;
      let minTimer = null;
      let forceCloseTimer = null;
      let hasLoaded = false;
      let minElapsed = false;
      let splashHidden = false;

      function hideSplash() {
        if (splashHidden) return;
        splashHidden = true;
        clearTimeout(minTimer);
        clearTimeout(forceCloseTimer);
        splash.classList.add("fade-out");
        setTimeout(function () {
          splash.style.display = "none";
        }, 380);
      }

      function tryHideSplash() {
        if (minElapsed && hasLoaded) {
          hideSplash();
        }
      }

      minTimer = setTimeout(function () {
        minElapsed = true;
        tryHideSplash();
      }, MIN_SPLASH_MS);

      // Batas aman agar tidak pernah mentok di splash jika event load iframe tidak terpicu
      forceCloseTimer = setTimeout(function () {
        hideSplash();
      }, FORCE_SPLASH_CLOSE_MS);

      function triggerBrowserDownload(base64Data, fileName, mimeType) {
        const cleanBase64 = base64Data.includes(",")
          ? base64Data.split(",")[1]
          : base64Data;

        const byteChars = atob(cleanBase64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) {
          byteNumbers[i] = byteChars.charCodeAt(i);
        }

        const blob = new Blob([new Uint8Array(byteNumbers)], { type: mimeType });
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = blobUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(function () {
          URL.revokeObjectURL(blobUrl);
        }, 2000);
      }

      window.addEventListener("message", function (event) {
        const data = event.data;
        if (!data || typeof data !== "object") return;

        if (data.type === "HBIG_DOWNLOAD_BASE64") {
          const base64Data = typeof data.base64Data === "string" ? data.base64Data.trim() : "";
          const fileName = data.fileName || "Data_Penerima_HBIG_dan_Pemantauan.xlsx";
          const mimeType = data.mimeType || "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

          if (!base64Data) return;

          if (window.AndroidDownloader && typeof window.AndroidDownloader.saveBase64File === "function") {
            window.AndroidDownloader.saveBase64File(base64Data, fileName, mimeType);
          } else {
            triggerBrowserDownload(base64Data, fileName, mimeType);
          }
        }
      });

      function showFallback() {
        hideSplash();
        fallback.classList.add("active");
      }

      function startLoad(url) {
        hasLoaded = false;
        fallback.classList.remove("active");

        clearTimeout(loadTimer);
        loadTimer = setTimeout(function () {
          if (!hasLoaded) {
            showFallback();
          }
        }, MAX_WAIT_MS);

        frame.src = url;
      }

      frame.addEventListener("load", function () {
        if (!frame.src || frame.src === "about:blank") return;
        hasLoaded = true;
        clearTimeout(loadTimer);
        tryHideSplash();
      });

      frame.addEventListener("error", function () {
        clearTimeout(loadTimer);
        showFallback();
      });

      retryBtn.addEventListener("click", function () {
        const separator = SCRIPT_URL.indexOf("?") === -1 ? "?" : "&";
        startLoad(SCRIPT_URL + separator + "_t=" + Date.now());
      });

      window.addEventListener("online", function () {
        if (fallback.classList.contains("active")) {
          retryBtn.click();
        }
      });

      startLoad(SCRIPT_URL);
    })();
  </script>
</body>
</html>
