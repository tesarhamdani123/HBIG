<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Aplikasi Web</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background-color: #ffffff;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 20;
      transition: opacity 0.25s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: #cbd5e1;
    }

    #fallback-panel {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #0f172a;
      color: #f8fafc;
      z-index: 30;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    #fallback-panel.active {
      display: flex;
    }

    .fallback-card {
      max-width: 420px;
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
    }

    .fallback-card h2 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .fallback-card p {
      font-size: 14px;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button, a.btn {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background-color: #38bdf8;
      color: #0f172a;
    }

    .btn-secondary {
      background-color: #334155;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <div id="loading-overlay" aria-live="polite">
    <div class="spinner"></div>
    <div class="loading-text">Memuat aplikasi...</div>
  </div>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbyu7sdosLW2ip6SXyJMeYAsPn4xviNMj7iPcLHfgU9qTcO1Gwg8LPG7Ljl-uRBCVCjZWw/exec"
    title="Google Apps Script Web App"
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write; downloads"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <div id="fallback-panel" role="alert">
    <div class="fallback-card">
      <h2>Aplikasi tidak dapat dimuat di frame</h2>
      <p>
        Hal ini biasanya terjadi jika deployment Google Apps Script belum diatur ke <strong>Anyone</strong>,
        sedang meminta login akun Google yang diblokir iframe, atau koneksi terputus.
      </p>
      <div class="btn-group">
        <button type="button" class="btn-primary" id="retry-btn">Muat Ulang</button>
        <a
          class="btn btn-secondary"
          id="direct-link"
          href="https://script.google.com/macros/s/AKfycbyu7sdosLW2ip6SXyJMeYAsPn4xviNMj7iPcLHfgU9qTcO1Gwg8LPG7Ljl-uRBCVCjZWw/exec"
          target="_blank"
          rel="noopener noreferrer"
        >
          Buka Langsung
        </a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyu7sdosLW2ip6SXyJMeYAsPn4xviNMj7iPcLHfgU9qTcO1Gwg8LPG7Ljl-uRBCVCjZWw/exec";
      const frame = document.getElementById("app-frame");
      const loading = document.getElementById("loading-overlay");
      const fallback = document.getElementById("fallback-panel");
      const retryBtn = document.getElementById("retry-btn");
      const directLink = document.getElementById("direct-link");

      directLink.href = SCRIPT_URL;

      let loadTimer = null;
      let hasLoaded = false;

      window.addEventListener("message", function (event) {
        const data = event.data;
        if (!data || typeof data !== "object") return;

        if (data.type === "HBIG_DOWNLOAD_BASE64") {
          const base64Data = data.base64Data || "";
          const fileName = data.fileName || ("Data_Penerima_HBIG_dan_Pemantauan_" + Date.now() + ".xlsx");
          const mimeType = data.mimeType || "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

          if (window.AndroidDownloader && typeof window.AndroidDownloader.saveBase64File === "function") {
            window.AndroidDownloader.saveBase64File(base64Data, fileName, mimeType);
          } else if (base64Data) {
            // Fallback jika dibuka di browser biasa tanpa AndroidDownloader
            const byteChars = atob(base64Data);
            const byteNumbers = new Array(byteChars.length);
            for (let i = 0; i < byteChars.length; i++) {
              byteNumbers[i] = byteChars.charCodeAt(i);
            }
            const blob = new Blob([new Uint8Array(byteNumbers)], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
          }
        }
      });

      function hideLoading() {
        loading.classList.add("hidden");
      }

      function showFallback() {
        hideLoading();
        fallback.classList.add("active");
      }

      function startLoad(url) {
        hasLoaded = false;
        fallback.classList.remove("active");
        loading.classList.remove("hidden");

        clearTimeout(loadTimer);
        loadTimer = setTimeout(function () {
          if (!hasLoaded) {
            showFallback();
          }
        }, 12000);

        frame.src = url;
      }

      frame.addEventListener("load", function () {
        hasLoaded = true;
        clearTimeout(loadTimer);
        hideLoading();
      });

      frame.addEventListener("error", function () {
        clearTimeout(loadTimer);
        showFallback();
      });

      retryBtn.addEventListener("click", function () {
        const separator = SCRIPT_URL.indexOf("?") === -1 ? "?" : "&";
        startLoad(SCRIPT_URL + separator + "_t=" + Date.now());
      });

      window.addEventListener("online", function () {
        if (fallback.classList.contains("active")) {
          retryBtn.click();
        }
      });

      startLoad(SCRIPT_URL);
    })();
  </script>
</body>
</html>
